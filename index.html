<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>太极团子 · 练功场</title>
<link rel="stylesheet" href="assets/playground.css">
</head>
<body>
<main>
  <header>
    <div><h1>太极团子</h1><p>把团子带进练功场，试试它的每个动作。</p></div>
    <button class="compare" id="compare" aria-pressed="false">切换到初版</button>
  </header>
  <div class="layout">
    <figure>
      <canvas id="arena" width="660" height="440" tabindex="0" aria-label="太极团子练功场。点击招呼，左右拖动跑步，上拖冲天，下拖遁地。聚焦后也可用方向键和空格。"></canvas>
      <figcaption><span>拖动团子 ↔ 跑步 · ↑ 一飞冲天 · ↓ 遁地 · 点按招呼</span><span id="state" aria-live="polite">正在载入</span></figcaption>
    </figure>
    <aside>
      <section class="card">
        <h2>试招</h2>
        <div class="moves">
          <button data-row="0" aria-pressed="false">待机</button><button data-row="3" aria-pressed="false">招呼</button><button data-row="4" aria-pressed="false">轻跳</button>
          <button data-row="2" aria-pressed="false">左移</button><button data-row="1" aria-pressed="false">右移</button><button data-row="5" aria-pressed="false">失手</button>
          <button data-row="6" aria-pressed="false">等待</button><button data-row="7" aria-pressed="false">推掌</button><button data-row="8" aria-pressed="false">复核</button>
          <button data-special="fly" aria-pressed="false">↑ 冲天</button><button data-special="burrow" aria-pressed="false">↓ 遁地</button>
        </div>
      </section>
      <section class="card challenge">
        <h2>跟练一套</h2>
        <progress id="progress" value="0" max="5" aria-label="跟练完成度"></progress>
        <p id="prompt" aria-live="polite">按顺序完成五个动作。可以用鼠标、键盘或上方按钮。</p>
        <button id="practice">开始跟练</button>
      </section>
    </aside>
  </div>
</main>
<script src="src/playground.js" defer></script>
</body>
</html>
